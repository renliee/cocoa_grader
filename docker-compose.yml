services:
  backend:
    build: ./backend
    environment:
      KAKAO_WEIGHTS: /app/weights/best.pt
      YOLO_CONFIG_DIR: /tmp/ultralytics
      KAKAO_DATA_DIR: /app/data
      KAKAO_ALLOW_HTTP_COOKIES: "1"
      KAKAO_PUBLIC_BASE_URL: ${KAKAO_PUBLIC_BASE_URL:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - kakao_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kakao_data:
